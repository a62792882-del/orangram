<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Orangram 🍊</title>
<style>
:root{color-scheme:dark;--bg:#090909;--panel:#1b1b1e;--line:#303035;--muted:#92929b;--blue:#3987f5;--orange:#ff9b32}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f7f7f8;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}button{border:0;border-radius:14px;padding:13px 16px;background:var(--blue);color:white;font-weight:650}
input{width:100%;background:#101013;color:white;border:1px solid var(--line);border-radius:13px;padding:15px;margin:7px 0;outline:none}
header{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#101013;z-index:2}
.brand{font-size:23px;font-weight:800}.brand span{color:var(--orange)}
main{max-width:680px;margin:auto;padding:18px 14px 90px}.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px;margin:16px 0}
.muted{color:var(--muted)}.hidden{display:none!important}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}
.avatar{width:48px;height:48px;border-radius:50%;background:#303039;display:grid;place-items:center;font-size:24px;flex:none}
.chatrow{padding:13px 2px;border-bottom:1px solid var(--line);cursor:pointer}.chatrow:last-child{border:0}
.tabs{display:flex;gap:8px}.tabs button{background:#29292f;flex:1}.tabs button.active{background:var(--blue)}
#messages{height:55vh;overflow:auto;display:flex;flex-direction:column;gap:9px;padding:12px 0}
.bubble{max-width:82%;padding:11px 14px;border-radius:17px;background:#303038;align-self:flex-start;overflow-wrap:anywhere}
.bubble.mine{background:#246ed0;align-self:flex-end}.small{font-size:12px;color:#c7c7cf;margin-top:4px}
footer{position:fixed;bottom:0;left:0;right:0;background:#111114;border-top:1px solid var(--line);padding:10px max(14px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}
footer input{margin:0}footer button{white-space:nowrap}
a{color:#8bb8ff}
</style>
</head>
<body>
<header><div class="brand">🍊 <span>Orangram</span></div><div id="balance" class="muted">🍊 —</div></header>
<main>
<section id="auth" class="card">
<h1>Добро пожаловать в Orangram</h1><p class="muted">Создай аккаунт и найди друзей по юзернейму.</p>
<div class="tabs"><button id="signupTab" class="active">Регистрация</button><button id="loginTab">Вход</button></div>
<div id="signupFields"><input id="displayName" placeholder="Как тебя зовут"><input id="newUsername" placeholder="Юзернейм (например, nikita123)"><input id="newEmail" type="email" placeholder="Электронная почта"><input id="newPassword" type="password" placeholder="Пароль (от 6 символов)"></div>
<div id="loginFields" class="hidden"><input id="email" type="email" placeholder="Электронная почта"><input id="password" type="password" placeholder="Пароль"></div>
<button id="authBtn" style="width:100%;margin-top:10px">Создать аккаунт</button><p id="authMsg" class="muted"></p>
</section>
<section id="app" class="hidden">
<div class="row between"><h2>Чаты</h2><button id="logout" style="background:#34343b">Выйти</button></div>
<div class="card"><h3>Найти друга</h3><div class="row"><input id="searchUser" placeholder="Введи точный юзернейм"><button id="searchBtn">Найти</button></div><div id="searchResult" class="muted"></div></div>
<div class="card"><h3>Мои переписки</h3><div id="chatList" class="muted">Пока нет сообщений. Найди друга выше.</div></div>
<section id="chatView" class="card hidden"><div class="row between"><div class="row"><div class="avatar">🍊</div><div><b id="chatName">Чат</b><div id="chatUsername" class="muted"></div></div></div><button id="backChats" style="background:#34343b">Назад</button></div><div id="messages"></div><div class="row"><input id="messageInput" placeholder="Сообщение..." style="margin:0"><button id="sendBtn">➤</button></div></section>
<p class="muted" style="font-size:12px">Демонстрационная ранняя версия. Не отправляй здесь конфиденциальную информацию.</p>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ВСТАВЬ СЮДА Project URL и anon public key из настроек Supabase */
const SUPABASE_URL = "https://mglxukdpbqjytfjidsur.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable__wWwRwdZ9aEvGr3L7g8XmA_ZGB5ohoY";
let db=null,user=null,currentFriend=null,channel=null,loginMode=false;
const $=id=>document.getElementById(id);
function msg(id,text){$(id).textContent=text}
function configReady(){return SUPABASE_URL.startsWith("https://") && !SUPABASE_URL.includes("ВСТАВЬ") && SUPABASE_ANON_KEY.length>20 && !SUPABASE_ANON_KEY.includes("ВСТАВЬ")}
function setMode(login){loginMode=login;$("signupFields").classList.toggle("hidden",login);$("loginFields").classList.toggle("hidden",!login);$("signupTab").classList.toggle("active",!login);$("loginTab").classList.toggle("active",login);$("authBtn").textContent=login?"Войти":"Создать аккаунт"}
$("signupTab").onclick=()=>setMode(false);$("loginTab").onclick=()=>setMode(true);
$("authBtn").onclick=async()=>{
 if(!configReady()){msg("authMsg","Сначала подключи Supabase по инструкции в README.md.");return}
 const email=loginMode?$("email").value.trim():$("newEmail").value.trim(),password=loginMode?$("password").value:$("newPassword").value;
 if(!email||!password){msg("authMsg","Заполни почту и пароль.");return}
 let r;
 if(loginMode) r=await db.auth.signInWithPassword({email,password});
 else{
  const username=$("newUsername").value.trim().toLowerCase(),display_name=$("displayName").value.trim();
  if(!/^[a-z0-9_]{3,24}$/.test(username)){msg("authMsg","Юзернейм: 3–24 символа, латинские буквы, цифры или _.");return}
  if(!display_name){msg("authMsg","Введи имя.");return}
  r=await db.auth.signUp({email,password,options:{data:{username,display_name}}});
  if(!r.error && r.data.user){const p=await db.from("profiles").upsert({id:r.data.user.id,username,display_name},{onConflict:"id"});if(p.error)r.error=p.error}
 }
 msg("authMsg",r.error?r.error.message:(loginMode?"Вход выполнен.":"Проверь почту, если включено подтверждение регистрации."));
 if(!r.error&&r.data.session){user=r.data.user;await showApp()}
};
async function showApp(){if(!user)return;$("auth").classList.add("hidden");$("app").classList.remove("hidden");await loadBalance();await loadChats()}
async function loadBalance(){const {data}=await db.from("profiles").select("oranges").eq("id",user.id).maybeSingle();$("balance").textContent="🍊 "+(data?.oranges??0)}
async function findUser(name){return await db.from("profiles").select("id,username,display_name").eq("username",name.toLowerCase()).neq("id",user.id).maybeSingle()}
$("searchBtn").onclick=async()=>{const name=$("searchUser").value.trim();if(!name)return;const {data,error}=await findUser(name);$("searchResult").innerHTML="";if(error||!data){msg("searchResult","Пользователь не найден.");return}const b=document.createElement("button");b.textContent="Написать "+data.display_name+" (@"+data.username+")";b.onclick=()=>openChat(data);$("searchResult").append(b)}
async function loadChats(){const {data,error}=await db.from("messages").select("sender_id,recipient_id,created_at").or(`sender_id.eq.${user.id},recipient_id.eq.${user.id}`).order("created_at",{ascending:false}).limit(100);if(error)return;const ids=[...new Set((data||[]).map(x=>x.sender_id===user.id?x.recipient_id:x.sender_id))];$("chatList").innerHTML="";if(!ids.length){msg("chatList","Пока нет сообщений. Найди друга выше.");return}for(const id of ids){const {data:p}=await db.from("profiles").select("id,username,display_name").eq("id",id).maybeSingle();if(!p)continue;const el=document.createElement("div");el.className="chatrow row";el.innerHTML=`<div class="avatar">🍊</div><div><b></b><div class="muted"></div></div>`;el.querySelector("b").textContent=p.display_name;el.querySelector(".muted").textContent="@"+p.username;el.onclick=()=>openChat(p);$("chatList").append(el)}}
async function openChat(friend){currentFriend=friend;$("chatView").classList.remove("hidden");$("chatName").textContent=friend.display_name;$("chatUsername").textContent="@"+friend.username;await loadMessages();if(channel)db.removeChannel(channel);channel=db.channel("dm-"+[user.id,friend.id].sort().join("-")).on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},payload=>{const m=payload.new;if((m.sender_id===user.id&&m.recipient_id===friend.id)||(m.sender_id===friend.id&&m.recipient_id===user.id))renderMessage(m)}).subscribe()}
function renderMessage(m){const el=document.createElement("div");el.className="bubble"+(m.sender_id===user.id?" mine":"");el.textContent=m.body;const t=document.createElement("div");t.className="small";t.textContent=new Date(m.created_at).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});el.append(t);$("messages").append(el);$("messages").scrollTop=$("messages").scrollHeight}
async function loadMessages(){$("messages").innerHTML="";const {data,error}=await db.from("messages").select("*").or(`and(sender_id.eq.${user.id},recipient_id.eq.${currentFriend.id}),and(sender_id.eq.${currentFriend.id},recipient_id.eq.${user.id})`).order("created_at");if(error){const p=document.createElement("p");p.className="muted";p.textContent=error.message;$("messages").append(p);return}(data||[]).forEach(renderMessage)}
$("sendBtn").onclick=sendMessage;$("messageInput").onkeydown=e=>{if(e.key==="Enter")sendMessage()};
async function sendMessage(){const body=$("messageInput").value.trim();if(!body||!currentFriend)return;const {error}=await db.from("messages").insert({sender_id:user.id,recipient_id:currentFriend.id,body});if(error){alert(error.message);return}$("messageInput").value="";await loadChats()}
$("backChats").onclick=()=>{$("chatView").classList.add("hidden");if(channel){db.removeChannel(channel);channel=null}currentFriend=null}
$("logout").onclick=async()=>{await db.auth.signOut();location.reload()};
(async()=>{if(configReady()){db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const {data}=await db.auth.getSession();if(data.session){user=data.session.user;await showApp()}}})();
</script>
</body></html>
